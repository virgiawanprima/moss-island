name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.ref }}
          filters: |
            code:
              - '!**/*.[mM][dD]'

  windows:
    name: Windows lint, tests and build
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: '1.99.1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Lint TypeScript and JavaScript
        run: npm run lint

      - name: Check types and build frontend
        run: npm run build

      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Lint Rust with Clippy
        run: cargo +1.99.1 clippy --locked --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Check Rust targets
        run: cargo +1.99.1 check --locked --all-targets --manifest-path src-tauri/Cargo.toml

      - name: Run Rust tests
        run: cargo +1.99.1 test --locked --manifest-path src-tauri/Cargo.toml
