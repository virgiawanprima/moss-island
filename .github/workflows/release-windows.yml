name: Build Windows release

on:
  workflow_dispatch:
    inputs:
      unsigned_preview:
        description: Publish an unsigned Windows testing prerelease
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  installer:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    environment: ${{ inputs.unsigned_preview && 'windows-preview' || 'windows-release' }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '1'
      RUSTUP_TOOLCHAIN: '1.99.1'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check signing configuration
        if: ${{ !inputs.unsigned_preview }}
        env:
          SIGNING_ENDPOINT: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.WINDOWS_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.WINDOWS_SIGNING_PROFILE }}
          SIGNING_SUBJECT: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          if ($env:SIGNING_ENDPOINT -cnotmatch '\Ahttps://[a-z0-9]+\.codesigning\.azure\.net/?\z' -or
              $env:SIGNING_ACCOUNT -cnotmatch '\A[a-zA-Z0-9-]+\z' -or
              $env:SIGNING_PROFILE -cnotmatch '\A[a-zA-Z0-9-]+\z' -or
              [string]::IsNullOrWhiteSpace($env:SIGNING_SUBJECT) -or
              !$env:AZURE_CLIENT_ID -or !$env:AZURE_CLIENT_SECRET -or !$env:AZURE_TENANT_ID) {
            throw 'Configure the windows-release environment and its Azure Artifact Signing Public Trust profile.'
          }
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm audit --audit-level=high
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup toolchain install 1.99.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure Windows signing
        if: ${{ !inputs.unsigned_preview }}
        env:
          SIGNING_ENDPOINT: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.WINDOWS_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.WINDOWS_SIGNING_PROFILE }}
        run: |
          cargo install artifact-signing-cli --version '=0.12.0' --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $config = @{ bundle = @{ windows = @{
            signCommand = "artifact-signing-cli -e $env:SIGNING_ENDPOINT -a $env:SIGNING_ACCOUNT -c $env:SIGNING_PROFILE -d Moss-Island %1"
          } } }
          $config | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath src-tauri/tauri.release.conf.json -Encoding utf8
      - name: Build and sign installer
        if: ${{ !inputs.unsigned_preview }}
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          npm run tauri -- build --bundles nsis --ci --config src-tauri/tauri.release.conf.json -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build unsigned preview installer
        if: ${{ inputs.unsigned_preview }}
        run: |
          npm run tauri -- build --bundles nsis --ci --no-sign -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Windows installation
        id: installer
        env:
          SIGNING_SUBJECT: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
          UNSIGNED_PREVIEW: ${{ inputs.unsigned_preview }}
        run: |
          function Assert-ReleaseSignature([string]$path) {
            $signature = Get-AuthenticodeSignature -LiteralPath $path
            if ($env:UNSIGNED_PREVIEW -ceq 'true') {
              if ($signature.Status -ne 'NotSigned') {
                throw "Expected an unsigned preview file: $path ($($signature.Status))."
              }
              return
            }
            if ($signature.Status -ne 'Valid' -or !$signature.TimeStamperCertificate -or
                $signature.SignerCertificate.Subject -cne $env:SIGNING_SUBJECT) {
              throw "Signature verification failed for $path ($($signature.Status)): expected publisher and timestamp."
            }
          }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '\A\d+\.\d+\.\d+\z' -or $tauriVersion -cne $version) {
            throw 'Package and Tauri release versions must match.'
          }
          $installer = "src-tauri/target/release/bundle/nsis/moss-island_${version}_x64-setup.exe"
          $installerPath = (Resolve-Path -LiteralPath $installer -ErrorAction Stop).Path
          Assert-ReleaseSignature $installerPath
          $installDir = Join-Path $env:RUNNER_TEMP 'Moss Island installation test'
          $process = Start-Process -FilePath $installerPath -ArgumentList "/S /D=$installDir" -WindowStyle Hidden -PassThru
          if (!$process.WaitForExit(120000)) {
            Stop-Process -Id $process.Id -ErrorAction SilentlyContinue
            throw 'Installer timed out'
          }
          if ($process.ExitCode -ne 0) { throw "Installer exited with code $($process.ExitCode)" }
          $appPath = Join-Path $installDir 'moss-island.exe'
          if (!(Test-Path -LiteralPath $appPath -PathType Leaf)) { throw 'Installed application missing' }
          Assert-ReleaseSignature $appPath
          $app = Start-Process -FilePath $appPath -WindowStyle Hidden -PassThru
          if ($app.WaitForExit(5000)) {
            throw "Installed app exited during startup with code $($app.ExitCode)"
          }
          Stop-Process -Id $app.Id
          $tag = "v$version"
          if ($env:UNSIGNED_PREVIEW -ceq 'true') { $tag = "$tag-preview.1" }
          $checksum = "src-tauri/target/release/bundle/nsis/SHA256SUMS-$tag.txt"
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($installer))" | Set-Content -LiteralPath $checksum -Encoding ascii
          "installer=$installer" >> $env:GITHUB_OUTPUT
          "checksum=$checksum" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verified-windows-installer
          if-no-files-found: error
          path: |
            ${{ steps.installer.outputs.installer }}
            ${{ steps.installer.outputs.checksum }}
    outputs:
      version: ${{ steps.installer.outputs.version }}

  publish:
    needs: installer
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: verified-windows-installer
          path: release-assets
      - name: Upload installer and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.installer.outputs.version }}
          UNSIGNED_PREVIEW: ${{ inputs.unsigned_preview }}
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION
          if ($version -notmatch '\A\d+\.\d+\.\d+\z') { throw 'Invalid release version' }
          $tag = "v$version"
          if ($env:UNSIGNED_PREVIEW -ceq 'true') { $tag = "$tag-preview.1" }
          $file = "moss-island_${version}_x64-setup.exe"
          $installer = Join-Path release-assets $file
          $checksum = Join-Path release-assets "SHA256SUMS-$tag.txt"
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ((Get-Content -LiteralPath $checksum -Raw).TrimEnd() -cne "$hash  $file") {
            throw 'Downloaded installer checksum does not match the tested installer.'
          }
          $existingTag = git ls-remote --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($existingTag) { throw "Tag already exists: $tag" }
          if ($env:UNSIGNED_PREVIEW -ceq 'true') {
            gh release create $tag $installer $checksum --target $env:GITHUB_SHA --draft --prerelease --latest=false --title "Moss Island $tag (unsigned Windows preview)" --notes-file "docs/releases/windows-preview.md"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $tag --draft=false --prerelease --latest=false
          } else {
            gh release create $tag $installer $checksum --target $env:GITHUB_SHA --draft --title "Moss Island $tag" --notes-file "docs/releases/$tag.md"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $tag --draft=false --latest
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
