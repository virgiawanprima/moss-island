name: Build Windows release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '1'
      RUSTUP_TOOLCHAIN: '1.99.1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup toolchain install 1.99.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build installer
        run: |
          npm run tauri -- build --bundles nsis --ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Windows installation
        id: installer
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version' }
          $installer = "src-tauri/target/release/bundle/nsis/moss-island_${version}_x64-setup.exe"
          $installerPath = (Resolve-Path -LiteralPath $installer -ErrorAction Stop).Path
          $installDir = Join-Path $env:RUNNER_TEMP 'Moss Island installation test'
          $process = Start-Process -FilePath $installerPath -ArgumentList "/S /D=$installDir" -PassThru
          if (!$process.WaitForExit(120000)) {
            Stop-Process -Id $process.Id -ErrorAction SilentlyContinue
            throw 'Installer timed out'
          }
          if ($process.ExitCode -ne 0) { throw "Installer exited with code $($process.ExitCode)" }
          $appPath = Join-Path $installDir 'moss-island.exe'
          if (!(Test-Path -LiteralPath $appPath -PathType Leaf)) { throw 'Installed application missing' }
          $app = Start-Process -FilePath $appPath -PassThru
          if ($app.WaitForExit(5000)) {
            throw "Installed app exited during startup with code $($app.ExitCode)"
          }
          Stop-Process -Id $app.Id
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "path=$installer" >> $env:GITHUB_OUTPUT
      - name: Upload installer and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.installer.outputs.tag }}
          INSTALLER_PATH: ${{ steps.installer.outputs.path }}
        run: |
          $tag = $env:RELEASE_TAG
          $installer = $env:INSTALLER_PATH
          $checksum = "src-tauri/target/release/bundle/nsis/SHA256SUMS-$tag.txt"
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($installer))" | Set-Content -LiteralPath $checksum -Encoding ascii
          gh release create $tag $installer $checksum --target $env:GITHUB_SHA --draft --title "Moss Island $tag" --notes-file "docs/releases/$tag.md"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
